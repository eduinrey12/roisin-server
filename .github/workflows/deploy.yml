name: Deploy Backend (NestJS)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Instalar dependencias
        run: pnpm install

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Compilar proyecto (Build)
        run: pnpm build

      - name: Preparar archivos de producción
        run: |
          rm -rf node_modules
          pnpm install --prod
          tar -czf deploy.tar.gz dist node_modules prisma package.json pnpm-lock.yaml

      - name: Subir archivos a Hostinger (SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          source: "deploy.tar.gz"
          target: "${{ secrets.REMOTE_TARGET }}"

      - name: Extraer archivos en Hostinger
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            cd ${{ secrets.REMOTE_TARGET }}
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz
            # Para ejecutar las migraciones debes hacerlo desde el Panel de Hostinger
